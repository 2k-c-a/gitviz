services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitviz
      POSTGRES_PASSWORD: gitviz
      POSTGRES_DB: gitviz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  # AI 리뷰·AI 분석은 API 프로세스 안의 스레드에서 실행한다(AD-33). 별도 AI worker·dispatcher는 없다.

volumes:
  postgres_data:
