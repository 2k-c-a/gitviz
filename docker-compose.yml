services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitviz
      POSTGRES_PASSWORD: gitviz
      POSTGRES_DB: gitviz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── AI 작업 처리(선택). `docker compose --profile ai up`으로 실행한다 ─────────────────
  # DB는 .env의 DATABASE_URL을 쓰므로 컨테이너에서 접근 가능한 주소여야 한다(localhost 불가).
  # worker와 dispatcher는 둘 다 필요하다: dispatcher가 없으면 접수된 작업이 대기열로 나가지 않고, worker가 없으면 처리되지 않는다.
  # 중단되면 작업은 처리권 만료 뒤 유지관리가 정리한다(docs/operations/ai.md). 점검: python tools/ops/ai_ops.py status
  ai-worker:
    profiles: ["ai"]
    restart: unless-stopped
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: >
      sh -c "pip install -q -r requirements.txt &&
             celery -A app.core.celery_app.celery worker -Q ai_prepare,ai_generate,ai_maintenance --loglevel=INFO"

  ai-dispatcher:
    profiles: ["ai"]
    restart: unless-stopped
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: sh -c "pip install -q -r requirements.txt && python -m app.tasks.ai_dispatch"

volumes:
  postgres_data:
