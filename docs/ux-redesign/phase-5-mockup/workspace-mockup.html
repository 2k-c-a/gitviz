<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>GitViz Workspace 목업 (Phase 5)</title>
<style>

:root{color-scheme:light;--canvas:#f5f7fa;--surface:#fff;--raised:#edf2f7;--text:#172033;--muted:#4b5b70;--border:#ccd5e0;--border-strong:#8a9bb0;--accent:#1d4ed8;--accent-soft:#e8efff;--on-primary:#fff;--ok:#166534;--ok-soft:#e9f7ee;--warn:#854d0e;--warn-soft:#fff5d6;--err:#b91c1c;--err-soft:#ffeded;--backdrop:rgb(17 24 39/45%);--font:'Segoe UI','Malgun Gothic',system-ui,sans-serif;--mono:'Cascadia Mono',Consolas,monospace}
[data-theme=dark]{color-scheme:dark;--canvas:#11161d;--surface:#1a222d;--raised:#253142;--text:#e6edf5;--muted:#b0bed0;--border:#425269;--border-strong:#637893;--accent:#8cb7ff;--accent-soft:#20365b;--ok:#86efac;--ok-soft:#123327;--warn:#fde047;--warn-soft:#3b3016;--err:#fda4af;--err-soft:#40222b;--backdrop:rgb(0 0 0/60%)}
*{box-sizing:border-box}
body{margin:0;background:var(--raised);color:var(--text);font:13px/1.5 var(--font)}
button,select,input,textarea{font:inherit;color:inherit}
.stage{padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;max-width:1300px;width:100%;padding:8px 12px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:12px}
.toolbar b{font-weight:600}.toolbar label{display:inline-flex;gap:4px;align-items:center}
.toolbar .seg button{padding:2px 10px}
.toolbar .seg button[aria-pressed=true]{background:var(--accent);color:var(--on-primary);border-color:var(--accent)}
.hint{color:var(--muted);font-size:12px;max-width:1300px;width:100%}
/* ---------- window ---------- */
.win{position:relative;display:flex;flex-direction:column;background:var(--canvas);border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;max-width:100%;box-shadow:0 8px 28px rgb(17 24 39/14%)}
.win.w600{width:600px;height:400px}.win.w900{width:900px;height:640px}.win.w1280{width:1280px;height:800px}
.titlebar{display:flex;align-items:center;height:32px;padding-left:10px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;flex:none}
.titlebar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.titlebar .wc{display:flex}.titlebar .wc span{width:40px;text-align:center;color:var(--muted)}
.menubar{display:flex;height:26px;background:var(--surface);border-bottom:1px solid var(--border);flex:none;padding:0 4px;position:relative}
.menubar button{border:0;background:none;padding:0 10px;font-size:12px;cursor:pointer}.menubar button:hover,.menubar button[aria-expanded=true]{background:var(--raised)}
.menu{position:absolute;top:26px;z-index:30;min-width:260px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 8px 28px rgb(17 24 39/14%);padding:4px}
.menu button{display:flex;justify-content:space-between;gap:20px;width:100%;text-align:left;padding:5px 10px;border-radius:4px}.menu kbd{color:var(--muted);font:11px var(--mono)}
.body{flex:1;min-height:0;display:flex;position:relative}
/* rail */
.rail{flex:none;width:208px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 6px;gap:2px}
.w900 .rail{width:56px}.w900 .rail .lbl{display:none}
.w600 .rail{position:absolute;z-index:20;top:0;bottom:0;left:0;width:208px;transform:translateX(-100%);transition:transform .12s}
.w600 .rail.open{transform:none;box-shadow:0 8px 28px rgb(17 24 39/30%)}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;position:relative}
.nav:hover{background:var(--raised)}.nav[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{flex:none}.nav .cnt{margin-left:auto;background:var(--err);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.w900 .nav .cnt{position:absolute;top:2px;right:4px;margin:0}
.rail hr{border:0;border-top:1px solid var(--border);margin:6px 4px;width:calc(100% - 8px)}
/* main column */
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.phead{flex:none;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 14px 0}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.prow select{font-weight:600;font-size:14px;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;height:22px;border:1px solid var(--border);border-radius:999px;background:var(--raised);font-size:12px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.path{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sp{flex:1}
.tabs{display:flex;gap:2px;margin-top:6px;overflow:hidden}
.tab{border:0;background:none;padding:6px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted)}
.tab:hover{color:var(--text)}.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabsel{display:none;margin:6px 0 8px}
.w600 .tabs{display:none}.w600 .tabsel{display:block;margin:4px 0 6px}

.w600 .phead{padding:4px 10px 0}.w600 .prow{flex-wrap:nowrap;gap:6px;min-height:28px}.w600 .path,.w600 .chip.ok,.w600 .acl{display:none}
.w600 .main{padding:10px}.w600 .actionbar{bottom:-10px;margin:10px -10px -10px;padding:6px 10px}
.content{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;overflow:auto;padding:14px}
.insp{flex:none;width:280px;border-left:1px solid var(--border);background:var(--surface);overflow:auto;padding:12px}

.w900 .insp.open,.w600 .insp.open{transform:none}
.insp h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
.status{flex:none;display:flex;gap:14px;align-items:center;height:24px;padding:0 12px;border-top:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.w600 .status .opt{display:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px}.dot.off{background:var(--border-strong)}
/* content primitives */
h1{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2{font-size:13px;margin:14px 0 6px;font-weight:600}
.panel{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:12px;margin-bottom:12px}
.panel h2:first-child{margin-top:0}
.note{color:var(--muted);font-size:12px}
.b{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 12px;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;cursor:pointer}
.b:hover:not(:disabled){background:var(--raised)}.b:disabled{opacity:.5;cursor:not-allowed}
.b.primary{background:var(--accent);color:var(--on-primary);border-color:var(--accent)}[data-theme=dark] .b.primary{background:#2563eb;color:#fff;border-color:#2563eb}
.b.sm{min-height:24px;padding:0 8px;font-size:12px}
.rk{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid currentColor;opacity:.85;line-height:15px}
.r-send{color:var(--warn)}.r-write{color:var(--err)}.r-exec{color:var(--err)}
.primary .rk{color:inherit}
.bdg{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border:1px solid var(--border-strong);border-radius:4px;font-size:11px;white-space:nowrap;background:var(--surface)}
.bdg.ai{border-style:dashed}.bdg.m{border-color:var(--ok);color:var(--ok)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:8px;margin-bottom:12px;border:1px solid transparent}

.todo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;margin-bottom:12px}.todo b{font-size:14px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--raised)}tr.row[aria-selected=true] td{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-size:12px}
input[type=text],input[type=password],input[type=search],textarea,select{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:3px 8px;min-height:28px;max-width:100%}
textarea{width:100%;min-height:56px}
label.f{display:block;margin:8px 0}label.f>span{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.split{display:flex;gap:12px;min-height:0}.split>.l{flex:0 0 40%;min-width:0}.split>.r{flex:1;min-width:0}
.w600 .split{flex-direction:column}
.list{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:auto;max-height:340px}
.item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);cursor:pointer}.item:hover{background:var(--raised)}.item[aria-selected=true]{background:var(--accent-soft)}
.item.grp{background:var(--raised);font-weight:600;font-size:12px;cursor:default;color:var(--muted)}
.diff{margin:0;padding:8px 0;background:var(--surface);border:1px solid var(--border);border-radius:8px;font:12px/1.6 var(--mono);overflow:auto;max-height:340px}
.diff div{padding:0 10px;white-space:pre}.diff .a{background:var(--ok-soft)}.diff .d{background:var(--err-soft)}.diff .h{color:var(--muted)}
.actionbar{position:sticky;bottom:-14px;margin:12px -14px -14px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.step{padding:3px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer}
.step[aria-current=step]{background:var(--accent);color:var(--on-primary);border-color:var(--accent)}[data-theme=dark] .step[aria-current=step]{background:#2563eb;color:#fff}
.log{margin:0;padding:8px 10px;background:var(--raised);border-radius:8px;font:12px/1.6 var(--mono);height:150px;overflow:auto;white-space:pre-wrap}
.skel{height:14px;border-radius:4px;background:var(--raised);margin:10px 0;animation:p 1.2s infinite alternate}@keyframes p{to{opacity:.4}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty p{margin:0 0 12px}
.big{font:600 28px var(--mono);letter-spacing:2px}
.checklist{list-style:none;margin:0;padding:0}.checklist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border)}
.checklist .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:12px;flex:none}
.checklist .done .n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dropzone{border:1px dashed var(--border-strong);border-radius:8px;padding:6px 12px;color:var(--muted)}
details{margin:8px 0}summary{cursor:pointer;color:var(--muted)}
/* overlays */
.scrim{position:absolute;inset:0;background:var(--backdrop);z-index:50;display:grid;place-items:start center;padding-top:60px}
.dlg{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 8px 28px rgb(17 24 39/30%);width:min(440px,92%);overflow:hidden}
.dlg .hd{padding:8px 14px;background:var(--raised);font-size:12px;color:var(--muted)}.dlg .bd{padding:14px}.dlg .ft{padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border)}
.pal input{width:100%;margin-bottom:6px}.pal .item{border-radius:6px;border:0}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--surface);padding:6px 14px;border-radius:6px;font-size:12px;max-width:90%}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (forced-colors:active){.chip,.bdg,.panel,.b{border:1px solid CanvasText}}
</style>

<script>

/* ---------------- render with focus restore ---------------- */
function render() {
  const ae = document.activeElement, key = ae?.dataset?.k, pos = ae?.selectionStart;
  document.body.dataset.theme = S.theme;
  const f = $('#frame'); f.className = 'win w' + S.size;
  const scroll = $('#main')?.scrollTop;
  f.innerHTML = shell();
  if (scroll) $('#main').scrollTop = scroll;
  $('#tb').innerHTML = toolbar();
  if (key) { const el = f.querySelector(`[data-k="${key}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch { /* not a text field */ } } }
  else if (S.modal?.type === 'pal') $('#pal')?.focus();
}

  connect: () => ask('계정·저장소 확인 후 연결', '로그인한 계정이 이 저장소를 볼 수 있는지 서버에서 확인합니다. 코드는 보내지 않습니다.', '연결', 'read', () => { PROJECTS[0].remote = '#1'; render(); }), checkconn: () => toast('연결 정상 (시뮬레이션)'),
  setsec: (a) => { S.setSec = a; render(); }, pickexe: () => toast('실행 파일 선택 창이 열립니다 (시뮬레이션)'), diag: () => toast('최소 진단 정보를 저장했습니다 (시뮬레이션)'), web: () => toast('웹 분석 화면으로 이동합니다 (시뮬레이션)'),
  menu: (a) => { S.menu = S.menu === a ? null : a; render(); }, togglenav: () => { S.navOpen = !S.navOpen; S.menu = null; render(); }, togglinsp: () => { S.inspOpen = !S.inspOpen; S.menu = null; render(); },
  toggletheme: () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; S.menu = null; render(); }, showfirst: () => { S.first = true; S.menu = null; render(); },
  modalcancel: () => { S.modal = null; render(); }, modalok: () => { const t = S.modal.then; S.modal = null; render(); t?.(); },
  palrun: (a) => { const it = palItems().filter(i => i[0].toLowerCase().includes(S.pal.q.toLowerCase()))[Number(a)]; S.modal = null; if (it) run(it[1]); render(); },
};
function run(spec) { const [n, a] = spec.split(':'); if (ACT[n]) ACT[n](a); }

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tb]');
  if (tb && tb.tagName === 'BUTTON') { const n = tb.dataset.tb, v = tb.dataset.v; if (n === 'size') S.size = Number(v); if (n === 'sim') S.sim = v; S.navOpen = S.inspOpen = false; return render(); }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (S.menu && !el.dataset.act.startsWith('menu')) S.menu = null;
  let act = el.dataset.act;
  if (act === 'modalcancel-bg') { if (e.target !== el) return; act = 'modalcancel'; }
  if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox' && act !== 'togglefile') return;
  if (act === 'openfile' && e.target.tagName === 'INPUT') return;
  if (act.startsWith('go:')) return ACT.go(act.slice(3));
  if (ACT[act]) ACT[act](el.dataset.arg);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.inspOpen || S.navOpen || S.menu) S.inspOpen = S.navOpen = false, S.menu = null; return render(); }
  if (S.modal?.type === 'pal') {
    const n = palItems().filter(i => i[0].toLowerCase().includes(S.pal.q.toLowerCase())).length;
    if (e.key === 'ArrowDown') { S.pal.i = Math.min(n - 1, S.pal.i + 1); e.preventDefault(); return render(); }
    if (e.key === 'ArrowUp') { S.pal.i = Math.max(0, S.pal.i - 1); e.preventDefault(); return render(); }
    if (e.key === 'Enter') { ACT.palrun(S.pal.i); e.preventDefault(); } return;
  }
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'k') { e.preventDefault(); S.pal = { q: '', i: 0 }; S.modal = { type: 'pal' }; return render(); }
  if (ctrl && e.key.toLowerCase() === 'o') { e.preventDefault(); return ACT.register(); }
  if (ctrl && e.key.toLowerCase() === 'b') { e.preventDefault(); return ACT.togglenav(); }
  if (ctrl && /^[1-7]$/.test(e.key) && !S.first) { e.preventDefault(); return ACT.go(TABS[Number(e.key) - 1][0]); }
  if (e.key === 'F5') { e.preventDefault(); return ACT.refresh(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role=option][data-act],tr.row')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.tb) return;
  if (t.dataset?.bind && (t.type === 'text' || t.type === 'search' || t.type === 'password' || t.tagName === 'TEXTAREA')) { setPath(t.dataset.bind, t.type === 'search' || t.tagName === 'TEXTAREA' || t.type === 'password' || t.type === 'text' ? t.value : t.value); if (t.dataset.bind === 'recent') S.recent = Number(t.value) || S.recent; if (t.dataset.bind === 'pal.q') S.pal.i = 0; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset?.tb) { const n = t.dataset.tb; if (n === 'first') S.first = t.checked; if (n === 'theme') S.theme = t.value; return render(); }
  if (!t.dataset?.bind) return;
  const path = t.dataset.bind;
  if (path === 'proj') { S.proj = Number(t.value); return render(); }
  if (path === 'route') { return ACT.go(t.value); }
  if (t.type === 'checkbox') setPath(path, t.checked); else if (t.type === 'radio') setPath(path, t.value); else if (t.tagName === 'SELECT') setPath(path, path === 'ai.model' || path === 'editor' || path === 'theme' || path.startsWith('inboxF') || path === 'sec' ? t.value : (path.startsWith('cmp.') ? t.value : t.value));
  if (path === 'cmp.before' || path === 'cmp.after') S.cmp.result = null;
  render();
});
render();
</script>
