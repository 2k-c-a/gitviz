name: Windows desktop fixture validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/workspace/**'
      - 'app/services/ai/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'tests/workspace/**'
      - 'packaging/agent/**'
      - 'scripts/validate_workspace_windows.ps1'
      - 'scripts/test_workspace_navigation.cjs'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies (CI only)
        shell: pwsh
        run: |
          python -m venv .validation/venv-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.validation/venv-workspace/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r packaging/agent/requirements-workspace.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/node_modules/electron/install.js
          exit $LASTEXITCODE
      - name: Validate with temporary fixture profiles
        shell: pwsh
        env:
          GITVIZ_CI_GOLDEN_SCHEMA: '1'
        run: ./scripts/validate_workspace_windows.ps1 -Node (Get-Command node.exe).Source -EvidenceDirectory "$env:RUNNER_TEMP/gitviz-evidence"
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fixture-evidence
          path: ${{ runner.temp }}/gitviz-evidence
          if-no-files-found: ignore
          retention-days: 7
