name: Windows desktop release (unsigned)
# Builds the unsigned Squirrel installer and package after the full fixture gate.
# - Manual run (workflow_dispatch): uploads the files as a workflow artifact only (7 days).
# - Pushing a tag v<desktop/package.json version> (e.g. v1.0.0): also creates a DRAFT GitHub Release with the files.
#   A maintainer reviews the draft and publishes it by hand. No code signing (owner decision, 2026-11-13).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match desktop/package.json version $version." }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies (CI only)
        shell: pwsh
        run: |
          python -m venv .validation/venv-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.validation/venv-workspace/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r packaging/agent/requirements-workspace.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/node_modules/electron/install.js
          exit $LASTEXITCODE
      # The gate includes workspace-unit; its npm hook test reports which precondition differed if it fails.
      - name: Gate on the full fixture validation
        shell: pwsh
        env:
          GITVIZ_CI_GOLDEN_SCHEMA: '1'
        run: ./tools/validation/validate_workspace_windows.ps1 -Node (Get-Command node.exe).Source -EvidenceDirectory "$env:RUNNER_TEMP/gitviz-evidence"
      - name: Make installer and package (unsigned)
        shell: pwsh
        run: |
          # npm ci --ignore-scripts skips electron-winstaller's install script, which selects the 7-Zip binary for this arch.
          $vendor = 'desktop/node_modules/electron-winstaller/vendor'
          Copy-Item "$vendor/7z-x64.exe" "$vendor/7z.exe"
          Copy-Item "$vendor/7z-x64.dll" "$vendor/7z.dll"
          npm --prefix desktop run make
          exit $LASTEXITCODE
      - name: Archive, hash and write update manifest
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gitviz-release'
          New-Item -ItemType Directory -Path $out | Out-Null
          $package = Get-ChildItem build-output/desktop -Directory | Where-Object Name -like 'GitVizWorkspace-win32-x64' | Select-Object -First 1
          if (-not $package) { throw 'Packaged directory not found.' }
          Compress-Archive -Path "$($package.FullName)/*" -DestinationPath (Join-Path $out 'GitVizWorkspace-win32-x64-unsigned.zip')
          $make = 'build-output/desktop/make/squirrel.windows/x64'
          $setup = Join-Path $make 'GitVizWorkspaceSetup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer not found.' }
          Copy-Item "$make/*" $out
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $setupItem = Get-Item (Join-Path $out 'GitVizWorkspaceSetup.exe')
          # Same shape desktop/src/update.ts parses; the URL is valid once the release with this tag is published.
          [ordered]@{ version = $version; assetName = $setupItem.Name; sha256 = (Get-FileHash $setupItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size = $setupItem.Length; url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($setupItem.Name)" } | ConvertTo-Json | Set-Content (Join-Path $out 'manifest.json') -Encoding utf8
          Get-ChildItem $out -File | Where-Object Name -ne 'manifest.json' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package
          path: ${{ runner.temp }}/gitviz-release
          if-no-files-found: error
          retention-days: 7
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-fixture-evidence
          path: ${{ runner.temp }}/gitviz-evidence
          if-no-files-found: ignore
          retention-days: 7

  release:
    # Only for tag pushes. Write access is limited to this job, which runs no project code.
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-package
          path: release-files
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## 설치

          1. 아래 **Assets**에서 `GitVizWorkspaceSetup.exe`를 받아 실행합니다. 관리자 권한 없이 내 계정에 설치되고, 끝나면 앱이 바로 열립니다.
          2. 코드 서명이 없는 설치 파일이라 **"Windows의 PC 보호"** 창이 뜰 수 있습니다. **추가 정보 → 실행**을 누르면 설치됩니다.
          3. 받은 파일이 맞는지 확인하려면 PowerShell에서 `Get-FileHash .\GitVizWorkspaceSetup.exe`의 값을 `SHA256SUMS.txt`와 비교합니다.

          Git for Windows가 없으면 앱의 **시작하기 > 시스템 환경 확인**에서 설치할 수 있습니다.

          | 파일 | 설명 |
          |---|---|
          | `GitVizWorkspaceSetup.exe` | 설치 파일 (Windows 10/11 x64) |
          | `GitVizWorkspace-win32-x64-unsigned.zip` | 설치 없이 실행하는 압축본 |
          | `*.nupkg`, `RELEASES`, `manifest.json` | 업데이트용 파일 |
          | `SHA256SUMS.txt` | 파일별 SHA-256 |
          EOF
          gh release create "$TAG" release-files/* --draft --verify-tag --title "GitViz Workspace $TAG" --notes-file notes.md
