name: Windows desktop release (DRAFT, unsigned, no publishing)
# Draft: manual trigger only. It packages an unsigned build and uploads it as a workflow artifact.
# It never creates a GitHub Release, signs, or calls an external service. Installer (maker-squirrel),
# signing and release publishing are intentionally absent until they are decided and approved.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies (CI only)
        shell: pwsh
        run: |
          python -m venv .validation/venv-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.validation/venv-workspace/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r requirements-workspace.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/node_modules/electron/install.js
          exit $LASTEXITCODE
      - name: Gate on the full fixture validation
        shell: pwsh
        env:
          GITVIZ_CI_GOLDEN_SCHEMA: '1'
        run: ./scripts/validate_workspace_windows.ps1 -Node (Get-Command node.exe).Source -EvidenceDirectory "$env:RUNNER_TEMP/gitviz-evidence"
      - name: Package (unsigned)
        shell: pwsh
        run: |
          npm --prefix desktop run package
          exit $LASTEXITCODE
      - name: Archive and hash
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gitviz-release'
          New-Item -ItemType Directory -Path $out | Out-Null
          $package = Get-ChildItem desktop/out -Directory | Where-Object Name -like 'GitVizWorkspace-win32-x64' | Select-Object -First 1
          if (-not $package) { throw 'Packaged directory not found.' }
          $zip = Join-Path $out 'GitVizWorkspace-win32-x64-unsigned.zip'
          Compress-Archive -Path "$($package.FullName)/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package
          path: ${{ runner.temp }}/gitviz-release
          if-no-files-found: error
          retention-days: 7
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-fixture-evidence
          path: ${{ runner.temp }}/gitviz-evidence
          if-no-files-found: ignore
          retention-days: 7
