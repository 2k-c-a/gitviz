name: Windows desktop release (DRAFT, unsigned, no publishing)
# Draft: manual trigger only. It builds an unsigned Squirrel installer and package and uploads them as a workflow artifact.
# It never creates a GitHub Release, signs, or calls an external service. Signing and release publishing are
# intentionally absent until a certificate and release location are decided and approved.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies (CI only)
        shell: pwsh
        run: |
          python -m venv .validation/venv-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.validation/venv-workspace/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r packaging/agent/requirements-workspace.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/node_modules/electron/install.js
          exit $LASTEXITCODE
      # The gate includes workspace-unit; its npm hook test reports which precondition differed if it fails.
      - name: Gate on the full fixture validation
        shell: pwsh
        env:
          GITVIZ_CI_GOLDEN_SCHEMA: '1'
        run: ./scripts/validate_workspace_windows.ps1 -Node (Get-Command node.exe).Source -EvidenceDirectory "$env:RUNNER_TEMP/gitviz-evidence"
      - name: Make installer and package (unsigned)
        shell: pwsh
        run: |
          # npm ci --ignore-scripts skips electron-winstaller's install script, which selects the 7-Zip binary for this arch.
          $vendor = 'desktop/node_modules/electron-winstaller/vendor'
          Copy-Item "$vendor/7z-x64.exe" "$vendor/7z.exe"
          Copy-Item "$vendor/7z-x64.dll" "$vendor/7z.dll"
          npm --prefix desktop run make
          exit $LASTEXITCODE
      - name: Archive, hash and write update manifest
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gitviz-release'
          New-Item -ItemType Directory -Path $out | Out-Null
          $package = Get-ChildItem desktop/out -Directory | Where-Object Name -like 'GitVizWorkspace-win32-x64' | Select-Object -First 1
          if (-not $package) { throw 'Packaged directory not found.' }
          Compress-Archive -Path "$($package.FullName)/*" -DestinationPath (Join-Path $out 'GitVizWorkspace-win32-x64-unsigned.zip')
          $make = 'desktop/out/make/squirrel.windows/x64'
          $setup = Join-Path $make 'GitVizWorkspaceSetup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer not found.' }
          Copy-Item "$make/*" $out
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $setupItem = Get-Item (Join-Path $out 'GitVizWorkspaceSetup.exe')
          # Same shape desktop/src/update.ts parses; the URL is only valid once a release with this tag is published manually.
          [ordered]@{ version = $version; assetName = $setupItem.Name; sha256 = (Get-FileHash $setupItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size = $setupItem.Length; url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($setupItem.Name)" } | ConvertTo-Json | Set-Content (Join-Path $out 'manifest.json') -Encoding utf8
          Get-ChildItem $out -File | Where-Object Name -ne 'manifest.json' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package
          path: ${{ runner.temp }}/gitviz-release
          if-no-files-found: error
          retention-days: 7
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-fixture-evidence
          path: ${{ runner.temp }}/gitviz-evidence
          if-no-files-found: ignore
          retention-days: 7
