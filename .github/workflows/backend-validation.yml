name: Backend validation
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitviz_test
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: gitviz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitviz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GITVIZ_TEST_DATABASE_URL: postgresql://gitviz_test:validation@localhost:5432/gitviz_test
      DATABASE_URL: postgresql://gitviz_test:validation@localhost:5432/gitviz_test
      SESSION_SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/test_backend_improvements.py
      - run: python scripts/test_analytics_calculations.py
      - run: python scripts/test_metric_policy.py
      - run: python scripts/test_repository_snapshots.py
      - run: python scripts/test_lightweight_score.py
      - run: node scripts/test_metric_display.cjs
      - run: python scripts/test_ai_contracts.py
      - run: python scripts/test_ai_security.py
      - run: python scripts/test_ai_schema.py
      - run: python scripts/test_ai_pr_collection.py
      - run: python scripts/test_ai_job_lifecycle.py
  ai-queue:
    # 실제 PostgreSQL·Redis와 별도 Celery worker 프로세스로 outbox → 큐 → worker 경로를 검증한다.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitviz_test
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: gitviz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitviz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GITVIZ_TEST_DATABASE_URL: postgresql://gitviz_test:validation@localhost:5432/gitviz_test
      GITVIZ_TEST_REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://gitviz_test:validation@localhost:5432/gitviz_test
      SESSION_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_ai_queue_integration.py
