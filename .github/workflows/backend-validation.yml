name: Backend validation
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B docs/audit/check_documents.py
      - run: python -B docs/audit/test_check_documents.py
      - run: python -B tests/server/test_validation_reports.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitviz_test
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: gitviz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitviz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GITVIZ_TEST_DATABASE_URL: postgresql://gitviz_test:validation@localhost:5432/gitviz_test
      DATABASE_URL: postgresql://gitviz_test:validation@localhost:5432/gitviz_test
      SESSION_SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_ai_insights_integration.py가 실제 main 이력을 수집한다
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python tests/server/test_backend_improvements.py
      - run: python tests/server/test_identity_resolution.py
      - run: python tests/server/test_analytics_calculations.py
      - run: python tests/server/test_metric_policy.py
      - run: python tests/server/test_repository_snapshots.py
      - run: python tests/server/test_lightweight_score.py
      - run: python tests/server/test_my_github_repositories.py
      - run: python tests/server/test_collab_network.py
      - run: node tests/frontend/test_metric_display.cjs
      - run: node tests/frontend/test_schedule_participants.cjs
      - run: python tests/server/test_community_notifications.py
      - run: node tests/frontend/test_file_tree.cjs
      - run: node tests/frontend/test_motion.cjs
      - run: python tests/server/test_ai_contracts.py
      - run: python tests/server/test_ai_security.py
      - run: python tests/server/test_desktop_auth.py
      - run: python tests/server/test_desktop_repository_identity.py
      - run: python tests/server/test_desktop_auth.py --postgres
      - run: python tests/server/test_desktop_api_compat.py
      - run: python tests/server/test_ai_schema.py
      - run: python tests/server/test_ai_pr_collection.py
      - run: python tests/server/test_ai_commit_collection.py
      - run: python tests/server/test_ai_job_lifecycle.py
      - run: python tests/server/test_ai_inputs.py
      - run: python tests/server/test_ai_input_api.py
      - run: python tests/server/test_ai_provider.py
      - run: python tests/server/test_ai_multi_provider.py
      - run: python tests/server/test_ai_multi_provider_api.py
      - run: python tests/server/test_ai_generation.py
      - run: python tests/server/test_ai_api.py
      - run: python tests/server/test_ai_pulls_api.py
      - run: python tests/server/test_ai_history_context.py
      - run: python tests/server/test_ai_ops.py
      - run: python tests/server/test_ai_evaluation.py
      - run: python tests/server/test_ai_smoke.py
      - run: node tests/frontend/test_ai_frontend.cjs
      - run: node tests/frontend/test_ai_insights_frontend.cjs
      - run: python tests/server/test_ai_output_validation.py
      - run: python tests/server/test_ai_output_limits.py
      - run: python tests/server/test_ai_insights.py
      - run: python tests/server/test_ai_insight_code.py
      # 이 저장소의 실제 Git 이력 → 수집 task·스냅샷 → 인사이트 API·worker task → 가짜 제공자(HTTP). checkout에 fetch-depth: 0 필요
      - run: python tests/server/test_ai_insights_integration.py
