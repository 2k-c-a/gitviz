<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="../js/ui/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../vendor/chart-4.4.1/chart.umd.min.js"></script>
    <script src="../vendor/d3-7.8.5/d3.min.js"></script>
    <link rel="stylesheet" href="../css/index.css">
    <title>GitViz</title>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="modal-container"></div>
    <!-- ═══════════ NETWORK ═══════════ -->
<div class="page active" id="page-network">
  <div class="dash-head">
    <div><div class="dash-title js-repo-title">—</div><div class="dash-sub">협업 네트워크 — 같은 PR에서 같은 파일을 함께 고친 관계와 PR 리뷰 관계</div></div>
    <div class="flex items-center gap-2.5">
      <div class="flex items-center gap-[7px]">
        <div class="status-dot" id="net-status-dot" style="background:var(--gray);"></div>
        <span id="net-status" class="text-xs text-muted-foreground">결과 조회 중</span>
      </div>
      <button class="btn-secondary" data-auth="1" id="btn-reanalyze" data-action="openReanalyzeToast">재분석</button>
    </div>
  </div>
  <div class="sub-tabs">
    <div class="sub-tab" data-action="goPage" data-args="%5B%22overview%22%5D">분석 개요</div>
    <div class="sub-tab active">협업 네트워크</div>
    <div class="sub-tab" data-action="goPage" data-args="%5B%22code-analysis%22%5D">코드분석</div>
    <div class="sub-tab" data-action="goPage" data-args="%5B%22history%22%5D">분석 이력·비교</div>
  </div>
  <div class="body">
    <!-- B. 프로젝트 전체(저장소 전체 기준) -->
    <div class="net-scope-label">프로젝트 전체 <span>저장소 전체 기준 · 그래프에 보이지 않는 개발자도 포함</span></div>
    <div class="metrics-4">
      <div class="metric-card"><div class="m-label">전체 개발자</div><div class="m-val" id="net-m-contributors">—</div><div class="m-sub" id="net-m-density">&nbsp;</div></div>
      <div class="metric-card"><div class="m-label">전체 커밋</div><div class="m-val" id="net-m-commits">—</div><div class="m-sub">최근 180일</div></div>
      <div class="metric-card"><div class="m-label">전체 병합 PR</div><div class="m-val" id="net-m-prs">—</div><div class="m-sub" id="net-m-edges">&nbsp;</div></div>
      <div class="metric-card"><div class="m-label">커뮤니티</div><div class="m-val" id="net-m-clusters">—</div><div class="m-sub" id="net-m-isolated">&nbsp;</div></div>
    </div>
    <!-- C. 협업 네트워크 + D. 상세 패널 -->
    <div class="panel mb-3.5 net-panel" id="net-panel">
      <div class="p-head mb-1.5">
        <div class="p-title">협업 네트워크</div>
        <div class="text-xs text-muted-foreground" id="net-period"></div>
      </div>
      <div id="net-toolbar" class="analysis-toolbar net-toolbar"></div>
      <p class="p-note" id="net-view-stats" role="status"></p>
      <div id="net-empty-note"></div>
      <div class="net-layout">
        <div class="net-graph-wrap" id="net-graph-wrap">
          <svg class="network-svg" id="net-graph-svg" aria-label="협업 네트워크 그래프"></svg>
          <div class="net-tooltip" id="net-tooltip" role="tooltip" hidden></div>
          <div class="net-legend" id="net-legend"></div>
        </div>
        <aside class="net-side" id="net-side" aria-live="polite"></aside>
      </div>
      <details class="net-isolated" id="net-isolated"><summary id="net-isolated-summary">연결이 발견되지 않은 개발자</summary><div id="net-isolated-list"></div></details>
      <div class="net-find"><input type="search" id="net-search" placeholder="그래프의 개발자 이름 검색" aria-label="그래프의 개발자 이름 검색"><div class="analysis-list" id="net-node-list"></div></div>
    </div>
    <!-- E. 하단: 주요 협업 쌍 -->
    <div class="panel">
      <div class="p-head mb-3.5">
        <div class="p-title">주요 협업 쌍</div>
        <div class="text-xs text-muted-foreground">저장소 전체 · 협업 강도 순</div>
      </div>
      <div id="net-top-pairs"></div>
    </div>
  </div>
</div>
</body>

<script type="module" src="../js/main.js"></script>
</html>
