<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="../js/ui/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/ai-review.css">
    <title>GitViz · AI 분석 · 커밋·PR 단위 분석</title>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="modal-container"></div>
    <!-- ═══════════ AI 분석 › 커밋·PR 단위 분석 (= AI 리뷰: PR → 파일 → 미리보기·동의 → 실행 → 결과·피드백) ═══════════
         자동 분석·대화형 분석 탭은 같은 저장소의 ai-insights.html로 이동한다.
         주소 ?repo=<id>&pr=<번호>&input=<uuid>&job=<uuid> 가 유일한 기준이다(저장된 값·기본 저장소 없음). -->
    <div class="page active" id="page-ai">
      <div class="dash-head">
        <div>
          <div class="dash-title" id="ai-title">AI 분석</div>
          <div class="dash-sub">커밋·PR 단위 분석: 선택한 PR·커밋 코드를 외부 AI 또는 같은 PC의 로컬 모델로 분석합니다. 외부 AI에는 본인의 API 키를 사용합니다. 결과는 사람이 검증하기 전까지 참고 자료입니다.</div>
        </div>
      </div>
      <div class="body ai-body">
        <div class="ai-tabs" role="tablist" aria-label="AI 분석 방식" id="ai-analysis-tabs" hidden>
          <button type="button" class="ai-tab" role="tab" aria-selected="false" data-insight-tab="auto">자동 분석</button>
          <button type="button" class="ai-tab" role="tab" aria-selected="false" data-insight-tab="chat">대화형 분석</button>
          <button type="button" class="ai-tab active" role="tab" aria-selected="true" id="ai-tab-review">커밋·PR 단위 분석</button>
        </div>
        <ol class="ai-steps" id="ai-steps" aria-label="진행 단계"></ol>
        <div id="ai-notice" aria-live="polite"></div>
        <section id="ai-scope"></section>
        <section id="ai-keys"></section>
        <section id="ai-main"></section>
      </div>
    </div>
</body>

<script type="module" src="../js/main.js"></script>
<script type="module" src="../js/ai-review.js"></script>
</html>
