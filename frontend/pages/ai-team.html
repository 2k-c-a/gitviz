<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/ai-review.css">
    <title>GitViz · 팀 점검</title>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="modal-container"></div>
    <!-- ═══════════ 팀 점검 (팀 → 구성원·저장소 → 명시적 공유 → 보고서) ═══════════
         주소 ?team=<uuid>&report=<uuid> 가 유일한 기준이다. 개인 자료는 작성자가 공유할 때만 팀에 보이고, 보이는 범위는 열 때마다 다시 확인한다. -->
    <div class="page active" id="page-team">
      <div class="dash-head">
        <div>
          <div class="dash-title" id="tm-title">팀</div>
          <div class="dash-sub">팀에 공유한 코드 리뷰 결과와 인계 준비 상태를 모아 점검합니다. 공유하지 않은 개인 자료는 보이지 않으며, AI 지적의 판정은 공유한 사람의 판단입니다.</div>
        </div>
      </div>
      <div class="body ai-body">
        <div id="tm-notice" aria-live="polite"></div>
        <section id="tm-main"></section>
      </div>
    </div>
</body>

<script type="module" src="../js/main.js"></script>
<script type="module" src="../js/ai-team.js"></script>
</html>
