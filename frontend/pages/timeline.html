<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../css/index.css">
    <title>GitViz</title>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="modal-container"></div>
    <!-- ═══════════ TIMELINE ═══════════ -->
<div class="page active" id="page-timeline">
  <div class="dash-head">
    <div>
      <div class="dash-title"><span id="tl-repo-name">—</span> <span class="badge badge-blue" id="tl-branch">main</span></div>
      <div class="dash-sub" id="tl-dash-sub">불러오는 중…</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:7px;">
        <div class="status-dot" style="background:#639922;"></div>
        <span style="font-size:12px;color:var(--text2);">분석 완료</span>
      </div>
      <button class="btn-secondary" data-auth="1" id="btn-reanalyze" onclick="openReanalyzeToast()">재분석</button>
    </div>
  </div>
  <div class="sub-tabs">
    <div class="sub-tab active">타임라인</div>
    <div class="sub-tab" onclick="location.href='./network.html'">협업 네트워크</div>
    <div class="sub-tab" onclick="location.href='./risk.html'">위험도</div>
    <div class="sub-tab" onclick="location.href='./coupling.html'">코드 영향도</div>
    <div class="sub-tab" onclick="location.href='./busfactor.html'">Bus Factor</div>
    <div class="sub-tab" onclick="location.href='./treemap.html'">BF 트리맵</div>
  </div>
  <div class="body">
    <div class="metrics-4">
      <div class="metric-card"><div class="m-label">총 커밋</div><div class="m-val" id="tl-m-commits">—</div><div class="m-sub m-up" id="tl-m-commits-sub">&nbsp;</div></div>
      <div class="metric-card"><div class="m-label">활성 기여자</div><div class="m-val" id="tl-m-contributors">—</div><div class="m-sub">최근 90일 기준</div></div>
      <div class="metric-card"><div class="m-label">릴리즈</div><div class="m-val" id="tl-m-releases">—</div><div class="m-sub" id="tl-m-releases-sub">&nbsp;</div></div>
      <div class="metric-card"><div class="m-label">버그 픽스 비율</div><div class="m-val m-dn" id="tl-m-bugfix">—</div><div class="m-sub">전체 커밋 기준</div></div>
    </div>

    <!-- 커밋 타임라인 차트 -->
    <div class="panel" style="margin-bottom:14px;">
      <div class="p-head">
        <div class="p-title">커밋 활동량 타임라인</div>
        <div class="range-btns">
          <div class="rbtn">6M</div><div class="rbtn">1Y</div><div class="rbtn active">3Y</div><div class="rbtn">전체</div>
        </div>
      </div>
      <div class="p-note">월별 커밋 수 · 활성 기여자 수 · 버그 픽스 비율 · 릴리즈 마커 오버레이</div>
      <div style="position:relative;height:180px;">
        <canvas id="chart-timeline"></canvas>
      </div>
      <div class="legend">
        <div class="leg-item"><div class="leg-line" style="background:var(--blue);"></div>커밋 수</div>
        <div class="leg-item"><div class="leg-line" style="background:var(--teal);"></div>활성 기여자 수</div>
        <div class="leg-item"><div class="leg-line" style="background:var(--amber);border-top:2px dashed var(--amber);height:0;"></div>버그 픽스 비율</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--red);"></div>릴리즈</div>
      </div>
    </div>

    <div class="col-2-1">
      <div class="stack">
        <!-- 기여자 히트맵 -->
        <div class="panel">
          <div class="p-head" style="margin-bottom:10px;">
            <div class="p-title">기여자별 활동 히트맵</div>
            <div style="font-size:11px;color:var(--text2);">최근 16주</div>
          </div>
          <div class="act-hm" id="act-heatmap">
            <div style="font-size:12px;color:var(--text3);text-align:center;padding:24px 8px;">불러오는 중…</div>
          </div>
        </div>
        <!-- 상위 기여자 -->
        <div class="panel">
          <div class="p-head" style="margin-bottom:14px;">
            <div class="p-title">상위 기여자</div>
            <div style="font-size:11px;color:var(--text2);">커밋 수 기준</div>
          </div>
          <div class="contrib-list" id="tl-contrib-list"></div>
        </div>
      </div>
      <div class="stack">
        <!-- 릴리즈 히스토리 -->
        <div class="panel">
          <div class="p-head" style="margin-bottom:14px;"><div class="p-title">릴리즈 히스토리</div></div>
          <div class="release-list" id="tl-release-list"></div>
        </div>
        <!-- 커밋 유형 도넛 -->
        <div class="panel">
          <div class="p-title" style="margin-bottom:12px;">커밋 유형 분포</div>
          <div class="donut-wrap">
            <canvas id="chart-donut" width="80" height="80" style="width:80px;height:80px;flex-shrink:0;"></canvas>
            <div class="donut-legend" id="tl-donut-legend"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>

<script type="module" src="../js/main.js"></script>
</html>
