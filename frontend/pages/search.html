<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="../js/ui/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <title>GitViz · 새 분석</title>
</head>
<body>
  <div id="navbar-container"></div>
  <div id="modal-container"></div>

  <!-- ═══════════ REPO SEARCH ═══════════ -->
  <div class="page active" id="page-search">
    <div class="dash-head">
      <div>
        <div class="dash-title">새 분석</div>
        <div class="dash-sub">GitHub 저장소를 검색해 고르거나, 주소(https://github.com/owner/repo)를 붙여 넣으면 바로 분석을 시작합니다</div>
      </div>
    </div>

    <div class="body">
      <div class="panel mb-3.5">
        <div class="search-bar ui-toolbar">
          <input type="search" id="search-input" aria-label="저장소 이름, 검색어 또는 GitHub 주소" placeholder="저장소 이름·키워드로 검색하거나 GitHub 주소를 붙여 넣으세요">
          <select class="ui-filter" id="search-sort" aria-label="검색 결과 정렬">
            <option value="stars">별 많은순</option>
            <option value="updated">최근 업데이트순</option>
          </select>
          <button class="btn-primary" id="search-btn">검색</button>
        </div>
        <div class="p-note mt-2.5 mb-0">
          점수 배지는 GitHub 메타데이터(최근 활동·이슈 비율)만으로 계산한 <strong>예비 점수</strong>입니다. 저장소를 내려받아 커밋·PR 이력까지 살펴보는 상세 분석(점검 우선순위 등)과는 다른 척도이니 참고용으로만 사용해 주세요.
        </div>
        <div class="search-examples" id="search-examples">
          <span style="font-size:var(--ui-text-xs);color:var(--text3);">예시:</span>
          <div class="chip search-example-chip" data-q="fastapi">fastapi</div>
          <div class="chip search-example-chip" data-q="react">react</div>
          <div class="chip search-example-chip" data-q="django">django</div>
        </div>
      </div>

      <div id="search-summary" class="search-summary" style="display:none;" role="status"></div>
      <div id="search-results" class="search-results">
        <div class="panel" style="padding:40px 20px;text-align:center;color:var(--text3);font-size:13px;">
          검색어를 입력하고 검색해 보세요.
        </div>
      </div>
      <nav id="search-pager" class="search-pager" aria-label="검색 결과 페이지" hidden></nav>
    </div>
  </div>

  <!-- "분석 시작" 흐름은 홈 화면과 동일한 진행 모달(main.js/modal.js)을 그대로 재사용한다.
       modal.js가 참조하는 url-input/url-feedback을 숨김 요소로 대신 제공한다. -->
  <input type="hidden" id="url-input">
  <div id="url-feedback" style="display:none;"></div>
</body>

<script type="module" src="../js/main.js"></script>
</html>
