<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
   <link rel="stylesheet" href="../css/index.css">
   <title>GitViz</title>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="modal-container"></div>
    <!-- ═══════════ COUPLING ═══════════ -->
<div class="page active" id="page-coupling">
  <div class="dash-head">
    <div><div class="dash-title js-repo-title">—</div><div class="dash-sub">코드 영향 관계 — PR 기반 Co-change + IDF 보정 + Hidden Coupling 탐지</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:7px;">
        <div class="status-dot" style="background:var(--gray);"></div>
        <span style="font-size:12px;color:var(--text2);">분석 연동 예정</span>
      </div>
      <button class="btn-secondary" data-auth="1" onclick="openReanalyzeToast()">재분석</button>
    </div>
  </div>
  <div class="sub-tabs">
    <div class="sub-tab" onclick="location.href='./timeline.html'">타임라인</div>
    <div class="sub-tab" onclick="location.href='./network.html'">협업 네트워크</div>
    <div class="sub-tab" onclick="location.href='./risk.html'">위험도</div>
    <div class="sub-tab active">코드 영향도</div>
    <div class="sub-tab" onclick="location.href='./busfactor.html'">Bus Factor</div>
  </div>
  <div class="body">
    <div class="metrics-4">
      <div class="metric-card"><div class="m-label">분석된 파일 쌍</div><div class="m-val" id="coup-m-pairs">—</div><div class="m-sub" id="coup-m-unit">&nbsp;</div></div>
      <div class="metric-card"><div class="m-label">강결합 쌍</div><div class="m-val" id="coup-m-high">—</div><div class="m-sub">결합도 ≥ 0.7</div></div>
      <div class="metric-card"><div class="m-label">평균 결합도</div><div class="m-val" id="coup-m-avg">—</div><div class="m-sub">IDF 보정값</div></div>
      <div class="metric-card"><div class="m-label">제외된 단위</div><div class="m-val" id="coup-m-excluded">—</div><div class="m-sub">대규모 변경 제외</div></div>
    </div>

    <!-- 영향도 그래프 -->
    <div class="panel" style="margin-bottom:14px;">
      <div class="p-head" style="margin-bottom:6px;">
        <div class="p-title">영향도 그래프</div>
        <div style="font-size:11px;color:var(--text2);">결합도 상위 파일 쌍 · 선 굵기 = adjusted score</div>
      </div>
      <svg class="coup-svg" id="coup-graph-svg"></svg>
    </div>

    <!-- 강결합 파일 쌍 -->
    <div class="panel">
      <div class="p-head" style="margin-bottom:6px;">
        <div class="p-title">강결합 파일 쌍</div>
        <div style="font-size:11px;color:var(--text2);">adjusted score 내림차순</div>
      </div>
      <div class="p-note">파일을 클릭하면 수정한 사람과 영향 파일을 볼 수 있습니다.</div>
      <div id="coup-pairs-list"></div>
    </div>
  </div>
</div>
</body>

<script type="module" src="../js/main.js"></script>
</html>
