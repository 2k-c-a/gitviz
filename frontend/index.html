<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitViz</title>

    <!-- Chart.js -->
    <script src="./vendor/chart-4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="./vendor/fontawesome-6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/index.css" />
  </head>

  <body>
    <!-- Navbar -->
    <div id="navbar-container"></div>
    <!-- modal -->
    <div id="modal-container"></div>

    <!-- ═══════════ LANDING ═══════════ -->
    <div class="page active" id="page-landing">
      <div class="landing-hero">
        <h1>Git 프로젝트, 한눈에 파악하세요</h1>

        <p>
          GitHub 저장소 주소만 입력하면 누가 어떤 파일을 자주 고쳤는지,
          어떤 파일들이 함께 수정되는지 분석해 먼저 살펴볼 파일을 알려드립니다.
        </p>

        <div class="url-form" id="url-form">
          <div class="url-row">
            <input
              type="text"
              placeholder="https://github.com/owner/repo"
              id="url-input"
            />

            <button
              class="btn-primary"
              id="btn-analyze"
              data-action="handleAnalyze"
            >
              분석 시작 →
            </button>
          </div>

          <div class="url-feedback" id="url-feedback"></div>
        </div>
      </div>

      <!-- 최근 분석 요청된 레포지토리 -->
      <div class="recent-section">
        <h3>최근 분석 요청된 레포지토리</h3>
        <div id="recent-repo-list"><div class="repo-meta" style="padding:16px 0;">불러오는 중...</div></div>
      </div>
    </div>
<footer>
   

  <div class="footer-social">

     <br><strong>GitViz</strong> - Git Repository Visualization Platform </br>© 2026 Capstone Design Project | Team 거북목</p>
    

    <a href="https://www.instagram.com" target="_blank">
      <img src="./img/instagram.png" alt="Instagram">
    </a>

    <a href="https://www.youtube.com" target="_blank">
      <img src="./img/youtube.png" alt="YouTube">
    </a>

    <a href="https://www.jangan.ac.kr" target="_blank">
      <img src="./img/jangan.png" alt="Jangan University">
    </a>

  </div>
</footer>

    <!-- JS -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
